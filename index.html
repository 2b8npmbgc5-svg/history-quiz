<script>

let questions = [];

let current = 0;
let selected = [];
let done = 0;
let correct = 0;
let wrongList = [];

fetch('questions.json')
  .then(res => res.json())
  .then(data => {

    questions = data.filter(q =>
      q &&
      q.question &&
      q.options &&
      q.options.length > 0
    );

    document.getElementById('total').innerText =
      questions.length;

    renderQuestion();

  })
  .catch(err => {

    console.error(err);

    alert('题库加载失败');

  });

function cleanQuestion(text){

  if(!text) return '';

  return text
    .replace(/答案[:：]?[A-D]+/g,'')
    .replace(/[（(]\s*[A-D]\s*[）)]/g,'（ ）')
    .replace(/\s+[A-D]$/g,'')
    .replace(/\s+/g,' ')
    .trim();

}

function renderQuestion(){

  if(!questions.length) return;

  const q = questions[current];

  let typeText = '题目';

  if(q.type === 'single'){

    typeText = '单选题';

  }else if(q.type === 'multiple'){

    typeText = '多选题';

  }else if(q.type === 'judge'){

    typeText = '判断题';

  }

  document.getElementById('typeTag').innerText =
    typeText;

  document.getElementById('question').innerText =
    cleanQuestion(q.question);

  document.getElementById('analysis').style.display =
    'none';

  const optionsDiv =
    document.getElementById('options');

  optionsDiv.innerHTML = '';

  selected = [];

  q.options.forEach(option => {

    const btn =
      document.createElement('button');

    btn.className = 'option';

    btn.innerText = option;

    btn.onclick = () => {

      const value = option[0];

      if(q.type === 'multiple'){

        if(selected.includes(value)){

          selected =
            selected.filter(i => i !== value);

          btn.classList.remove('selected');

        }else{

          selected.push(value);

          btn.classList.add('selected');

        }

      }else{

        document
          .querySelectorAll('.option')
          .forEach(o =>
            o.classList.remove('selected')
          );

        btn.classList.add('selected');

        selected = [value];

      }

    };

    optionsDiv.appendChild(btn);

  });

}

function submitAnswer(){

  if(!questions.length) return;

  const q = questions[current];

  let right = false;

  if(Array.isArray(q.answer)){

    right =
      JSON.stringify(selected.sort()) ===
      JSON.stringify(q.answer.sort());

  }else{

    right = selected[0] == q.answer;

  }

  done++;

  if(right){

    correct++;

  }else{

    if(!wrongList.includes(q)){

      wrongList.push(q);

    }

  }

  document.getElementById('done').innerText =
    done;

  document.getElementById('wrong').innerText =
    wrongList.length;

  document.getElementById('rate').innerText =
    Math.floor(correct / done * 100) + '%';

  document.getElementById('analysis').style.display =
    'block';

  document.getElementById('answer').innerText =
    '正确答案：' +
    (Array.isArray(q.answer)
      ? q.answer.join(',')
      : q.answer);

  document.getElementById('explanation').innerText =
    q.explanation || '暂无解析';

}

function nextQuestion(){

  if(!questions.length) return;

  current++;

  if(current >= questions.length){

    current = 0;

  }

  renderQuestion();

}

function randomQuestion(){

  if(!questions.length) return;

  current =
    Math.floor(Math.random() * questions.length);

  renderQuestion();

}

function showWrongQuestions(){

  if(wrongList.length === 0){

    alert('暂无错题');

    return;

  }

  const randomWrong =
    wrongList[
      Math.floor(
        Math.random() * wrongList.length
      )
    ];

  current =
    questions.indexOf(randomWrong);

  renderQuestion();

}

</script>
